<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Universal AI Chat</title>
<style>
  :root {
    --bg: #0e0e10;
    --panel: #17171a;
    --border: #2a2a2e;
    --text: #eaeaea;
    --muted: #8a8a90;
    --accent: #76b900; /* nvidia green default vibe, change if you want */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app { width: 100%; max-width: 640px; }
  h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }

  .config {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .config input {
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.82rem;
    width: 100%;
  }
  .config .full { grid-column: 1 / -1; }

  .limits {
    font-size: 0.78rem;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
  }
  .limits b { color: var(--text); }
  .limits .warn { color: var(--accent); }

  #messages {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    height: 380px;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 10px; line-height: 1.4; font-size: 0.92rem; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--accent); color: #0e0e10; font-weight: 500; }
  .assistant { align-self: flex-start; background: #232326; color: var(--text); }
  .form-row { display: flex; gap: 8px; margin-top: 12px; }
  #input {
    flex: 1;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.92rem;
  }
  button {
    padding: 10px 18px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #0e0e10;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <h1>Universal AI Chat</h1>
  <div class="sub">Works with any OpenAI-compatible API — NVIDIA NIM, OpenAI, Groq, Together, etc.</div>

  <div class="config">
    <input id="baseUrl" class="full" type="text"
      value="https://integrate.api.nvidia.com/v1/chat/completions"
      placeholder="API endpoint URL" />
    <input id="apiKey" type="password" placeholder="API key (nvapi-...)" />
    <input id="model" type="text" placeholder="Model name" value="meta/llama-3.1-8b-instruct" />
  </div>

  <div id="limits" class="limits">No requests sent yet.</div>

  <div id="messages"></div>

  <div class="form-row">
    <input id="input" type="text" placeholder="Type a message..." />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const apiKeyEl = document.getElementById("apiKey");
  const baseUrlEl = document.getElementById("baseUrl");
  const modelEl = document.getElementById("model");
  const limitsEl = document.getElementById("limits");

  let history = [];

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function updateLimits(headers) {
    // Different providers use different header names, so we check a few known ones.
    const candidates = [
      ["x-ratelimit-remaining-requests", "x-ratelimit-limit-requests", "requests"],
      ["x-ratelimit-remaining-tokens", "x-ratelimit-limit-tokens", "tokens"],
      ["anthropic-ratelimit-requests-remaining", "anthropic-ratelimit-requests-limit", "requests"],
      ["anthropic-ratelimit-tokens-remaining", "anthropic-ratelimit-tokens-limit", "tokens"]
    ];

    let found = [];
    for (const [remKey, limKey, label] of candidates) {
      const rem = headers.get(remKey);
      const lim = headers.get(limKey);
      if (rem !== null || lim !== null) {
        const lowClass = rem && lim && (rem / lim) < 0.2 ? "warn" : "";
        found.push(`<span class="${lowClass}">${label} left: <b>${rem ?? "?"}</b> / ${lim ?? "?"}</span>`);
      }
    }

    const resetReq = headers.get("x-ratelimit-reset-requests") || headers.get("anthropic-ratelimit-requests-reset");
    if (resetReq) found.push(`<span>Resets: <b>${resetReq}</b></span>`);

    if (found.length === 0) {
      limitsEl.innerHTML =
        "No rate-limit headers exposed by this API/browser (often blocked by CORS). " +
        "Check your provider's dashboard for usage instead.";
    } else {
      limitsEl.innerHTML = found.join(" ");
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    const apiKey = apiKeyEl.value.trim();
    const baseUrl = baseUrlEl.value.trim();
    const model = modelEl.value.trim();

    if (!text) return;
    if (!apiKey || !baseUrl || !model) {
      alert("Fill in the endpoint URL, API key, and model name first.");
      return;
    }

    addMessage("user", text);
    history.push({ role: "user", content: text });
    inputEl.value = "";
    sendBtn.disabled = true;
    const loadingMsg = addMessage("assistant", "...");

    try {
      const response = await fetch(baseUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + apiKey
        },
        body: JSON.stringify({
          model: model,
          messages: history,
          max_tokens: 1000,
          stream: false
        })
      });

      updateLimits(response.headers);

      const data = await response.json();

      if (!response.ok) {
        const errMsg = data.error?.message || data.message || JSON.stringify(data);
        loadingMsg.textContent = "Error: " + errMsg;
      } else {
        // OpenAI-compatible shape (used by NVIDIA NIM too)
        const reply = data.choices?.[0]?.message?.content
          ?? data.content?.[0]?.text // fallback for Anthropic-shaped responses
          ?? "No response content found.";
        loadingMsg.textContent = reply;
        history.push({ role: "assistant", content: reply });
      }
    } catch (err) {
      loadingMsg.textContent = "Request failed: " + err.message;
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
