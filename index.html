<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat with Claude</title>
<style>
  :root {
    --bg: #0e0e10;
    --panel: #17171a;
    --border: #2a2a2e;
    --text: #eaeaea;
    --muted: #8a8a90;
    --accent: #d97757;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  #apiKey {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.85rem;
  }
  #messages {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    height: 420px;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 10px; line-height: 1.4; font-size: 0.92rem; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; }
  .assistant { align-self: flex-start; background: #232326; color: var(--text); }
  .form-row { display: flex; gap: 8px; margin-top: 12px; }
  #input {
    flex: 1;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.92rem;
  }
  button {
    padding: 10px 18px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .limits {
    font-size: 0.78rem;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
  }
  .limits b { color: var(--text); }
  .limits .warn { color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <h1>Chat with Claude</h1>
  <div class="sub">Paste your Anthropic API key below (kept only in this browser tab).</div>
  <input id="apiKey" type="password" placeholder="sk-ant-..." />

  <div id="limits" class="limits">No requests sent yet.</div>

  <div id="messages"></div>

  <div class="form-row">
    <input id="input" type="text" placeholder="Type a message..." />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const apiKeyEl = document.getElementById("apiKey");

  let history = [];

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  const limitsEl = document.getElementById("limits");

  function updateLimits(headers) {
    const reqLimit = headers.get("anthropic-ratelimit-requests-limit");
    const reqRemaining = headers.get("anthropic-ratelimit-requests-remaining");
    const reqReset = headers.get("anthropic-ratelimit-requests-reset");
    const tokLimit = headers.get("anthropic-ratelimit-tokens-limit");
    const tokRemaining = headers.get("anthropic-ratelimit-tokens-remaining");

    if (!reqLimit && !tokLimit) {
      limitsEl.innerHTML =
        "Rate limit headers not visible from the browser (blocked by CORS on this endpoint). " +
        "This only works reliably when called from a backend.";
      return;
    }

    const reqLowClass = reqRemaining && reqLimit && (reqRemaining / reqLimit) < 0.2 ? "warn" : "";
    const tokLowClass = tokRemaining && tokLimit && (tokRemaining / tokLimit) < 0.2 ? "warn" : "";

    limitsEl.innerHTML = `
      <span class="${reqLowClass}">Requests left: <b>${reqRemaining ?? "?"}</b> / ${reqLimit ?? "?"}</span>
      <span class="${tokLowClass}">Tokens left: <b>${tokRemaining ?? "?"}</b> / ${tokLimit ?? "?"}</span>
      ${reqReset ? `<span>Resets: <b>${new Date(reqReset).toLocaleTimeString()}</b></span>` : ""}
    `;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    const apiKey = apiKeyEl.value.trim();
    if (!text) return;
    if (!apiKey) {
      alert("Enter your Anthropic API key first.");
      return;
    }

    addMessage("user", text);
    history.push({ role: "user", content: text });
    inputEl.value = "";
    sendBtn.disabled = true;
    const loadingMsg = addMessage("assistant", "...");

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: history
        })
      });

      updateLimits(response.headers);

      const data = await response.json();

      if (data.error) {
        loadingMsg.textContent = "Error: " + data.error.message;
      } else {
        const reply = data.content[0].text;
        loadingMsg.textContent = reply;
        history.push({ role: "assistant", content: reply });
      }
    } catch (err) {
      loadingMsg.textContent = "Request failed: " + err.message;
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
